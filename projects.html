<!DOCTYPE html>
<html>
<head>
    <title>Portfolio</title>
    <link rel="stylesheet" href="css/style.css">  
</head>
<style>
body {
  font-family: Consolas, sans-serif;
  background-color: #f4f4f4; /* Optional light gray background */
}

table {
  width: 100%;
  margin: 20px auto;
  border-collapse: collapse;
  background-color: white;
  box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
  border-radius: 8px;
}

th, td {
  font-size: 14px; /* Adjust text size */
  border: 1px solid #ddd;
  padding: 10px; /* Optional: reduce padding */
  text-align: left;
}

th {
  background-color: #333185;
  color: white;
}

tr:nth-child(even) {
  background-color: #f2f2f2;
}

tr:hover {
  background-color: #ddd;
}

.no-data {
  text-align: center;
  color: #999;
}
</style>
<body>
    <div class="topnav" id="myTopnav">
      <a href="index.html">Home</a>
      <a href="about.html">About Me</a>
      <div class="dropdown">
        <button class="dropbtn">My Works 
          <i class="fa fa-caret-down"></i>
        </button>
        <div class="dropdown-content">
          <a href="resume.html">Resume</a>
          <a href="projects.html">Portfolio</a>
        </div>
      </div> 
      <a href="contact.html">Contact Me</a>
      <a href="javascript:void(0);" class="icon" onclick="myFunction()">&#9776;</a>
    </div>

    <div class="container">
      <h1 style="text-align: center; margin-top: 20px;">Portfolio</h1>
        <div class="content-block">
            <table id="projects-table">
                <thead>
                    <tr>
                        <th>Project Name</th>
                        <th>Description</th>
                        <th>Technologies Used</th>
                        <th>Link</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Table rows will be inserted here via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <footer>
      <p>Copyright &copy; 2024 Alex Do</p>
    </footer>

    <script>
      // Function to load CSV data and populate the table
      fetch('assets/files/projects.csv')
        .then(response => response.text())
        .then(data => {
            const rows = data.trim().split('\n');
            const tableBody = document.querySelector('#projects-table tbody');

            rows.forEach((row, index) => {
                if (index === 0) return; // Skip header

                const cols = parseCSVRow(row);

                if (cols.length >= 5) {
                    const tr = document.createElement('tr');

                    cols.forEach((col, colIndex) => {
                        const td = document.createElement('td');

                        if (colIndex === 3) {
                            if (col.trim() !== "") {
                                const link = document.createElement('a');
                                link.href = col.trim();
                                link.target = "_blank";
                                link.textContent = "View Project";
                                td.appendChild(link);
                            } else {
                                td.textContent = "N/A";
                            }
                        } else {
                            td.textContent = col.trim() || "N/A";
                        }

                        tr.appendChild(td);
                    });

                    tableBody.appendChild(tr);
                }
            });
        })
        .catch(error => {
            console.error("Error loading CSV:", error);

            const tableBody = document.querySelector('#projects-table tbody');

            const row = document.createElement('tr');
            const cell = document.createElement('td');

            cell.colSpan = 5;
            cell.textContent = "Unable to load projects.";
            cell.classList.add("no-data");

            row.appendChild(cell);
            tableBody.appendChild(row);
        });


        // CSV parser that supports commas inside quotes
        function parseCSVRow(row) {
            const result = [];
            let current = "";
            let insideQuotes = false;

            for (let i = 0; i < row.length; i++) {
                const char = row[i];

                if (char === '"') {
                    insideQuotes = !insideQuotes;
                } 
                else if (char === ',' && !insideQuotes) {
                    result.push(current);
                    current = "";
                } 
                else {
                    current += char;
                }
            }

            result.push(current);

            return result;
        }
  
      document.body.classList.add('fade');
    
    
      document.addEventListener("DOMContentLoaded", () => {
          window.setTimeout(function() {
              document.body.classList.remove('fade');
          }, 230);
      });

      rows.forEach((row, index) => {
        if (index === 0) return; // Skip the header row
        const cols = parseCSVRow(row); // Parse each row to handle commas inside quotes
        if (cols.length >= 5) {
          const tr = document.createElement('tr');
          cols.forEach((col, colIndex) => {
            const td = document.createElement('td');
            if (colIndex === 3) { // Assuming the 4th column contains the link
              const link = document.createElement('a');
              link.href = col.trim() || '#'; // Use '#' if the link is empty
              link.target = '_blank'; // Open link in a new tab
              link.textContent = col.trim() || 'N/A'; // Display text
              td.appendChild(link);
            } else {
              td.textContent = col.trim() || 'N/A';
            }
            tr.appendChild(td);
          });
          tableBody.appendChild(tr);
        }
      });

  </script>
  
</body>
</html>
